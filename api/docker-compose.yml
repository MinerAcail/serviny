services:
  servinydb:
    image: postgres:alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${UserName}
      - POSTGRES_PASSWORD=${Password}
      - POSTGRES_DB=${DBName}
    volumes:
      - serviny-data:/var/lib/postgresql/data
    networks:
      - serviny-network

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - serviny-network

  minio:
    image: minio/minio:RELEASE.2024-07-26T20-48-21Z.fips
    ports:
      - "5000:5000"
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - serviny-network

  api:
    build: .
    env_file:
      - .env
    ports:
      - "4003:4003"
    volumes:
      - .:/usr/src/app
    environment:
      - Port=${Port}
      - UserName=${UserName}
      - Password=${Password}
      - DBName=${DBName}
      - Host=servinydb
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    # command: CompileDaemon --build="go build -o main ." --command="./main"
    networks:
      - serviny-network

volumes:
  serviny-data:
  minio-data:
  redis-data:


networks:
  serviny-network:
